databases:
  - name: l0l1-db
    plan: free
    databaseName: l0l1
    user: l0l1

services:
  - type: web
    name: l0l1-platform
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m backend.seed"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: l0l1-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9
